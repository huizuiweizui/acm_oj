# 默认站点：HTTP，适合用公网 IP 直接访问的演示环境。
# 有域名和证书后改用 site-https.conf（deploy/.env 里设 NGINX_SITE_CONF=site-https.conf）。

# 访问日志带上请求总耗时与上游耗时，排查"大模型改造"这类慢请求时有用
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/site-common.inc;
}
