# HTTPS 站点：80 端口统一跳转到 443。启用步骤见 deploy/README.md「启用 HTTPS」：
#   1. 证书放到 deploy/nginx/certs/fullchain.pem 与 privkey.pem；
#   2. deploy/.env 设 NGINX_SITE_CONF=site-https.conf、USE_HTTPS=True，并把域名加进 ALLOWED_HOSTS；
#   3. docker compose up -d（web 与 nginx 会重建）。

log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/site-common.inc;
}
