{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - ACM OJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --on: 0;
      --shade-hue: 45;
      --bg: #121921;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans SC', sans-serif;
      color: #c8d6e5;
      position: relative;
      overflow: hidden;
    }

    /* Ambient room light */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse 50% 40% at 38% 42%,
        hsl(var(--shade-hue), 65%, 16%), transparent 68%
      );
      opacity: calc(var(--on) * 0.55);
      transition: opacity 0.9s ease, background 0.9s ease;
      pointer-events: none;
      z-index: 0;
    }

    /* Scene layout */
    .scene {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      flex-wrap: wrap;
      padding: 36px 24px 60px;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
    }

    /* ────────────────────────── LAMP ────────────────────────── */
    .lamp-wrap {
      position: relative;
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #lamp-svg {
      transition: filter 0.7s ease;
      overflow: visible;
    }

    .lamp-lit #lamp-svg {
      filter: drop-shadow(0 0 22px hsl(var(--shade-hue), 85%, 52%));
    }

    /* Rope zone — sits below the shade */
    .rope-zone {
      position: absolute;
      top: 136px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
    }

    #rope-svg { overflow: visible; display: block; }

    .rope-knob {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 26px;
      background: #19283a;
      border: 2px solid #2e4460;
      border-radius: 50%;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      transition: border-color 0.4s;
      z-index: 10;
    }
    .rope-knob:active { cursor: grabbing; }
    .lamp-lit .rope-knob {
      border-color: hsl(var(--shade-hue), 60%, 35%);
    }
    .rope-knob-dot {
      width: 9px;
      height: 9px;
      background: #2e4460;
      border-radius: 50%;
      transition: background 0.4s;
    }
    .lamp-lit .rope-knob-dot {
      background: hsl(var(--shade-hue), 60%, 40%);
    }

    .lamp-hint {
      margin-top: 10px;
      font-size: 0.68rem;
      color: #263648;
      letter-spacing: 0.05em;
      text-align: center;
      transition: color 0.5s;
      pointer-events: none;
    }
    .lamp-lit .lamp-hint { color: hsl(var(--shade-hue), 40%, 40%); }

    /* ────────────────────────── FORM ────────────────────────── */
    .login-card {
      width: 340px;
      background: rgba(14, 22, 34, 0.92);
      border: 1.5px solid hsl(var(--shade-hue), 45%, 24%);
      border-radius: 18px;
      padding: 38px 32px 32px;
      opacity: 0;
      transform: scale(0.80) translateY(12px);
      pointer-events: none;
      transition:
        opacity 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        border-color 0.6s,
        box-shadow 0.6s;
      box-shadow: none;
    }

    .login-card.show {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: all;
      box-shadow:
        0 0 0 1px hsl(var(--shade-hue), 60%, 30%),
        0 0 40px hsl(var(--shade-hue), 75%, 20%),
        0 0 80px hsl(var(--shade-hue), 55%, 12%),
        0 16px 48px rgba(0, 0, 0, 0.65);
    }

    .login-card h2 {
      font-size: 1.42rem;
      font-weight: 600;
      color: hsl(var(--shade-hue), 90%, 74%);
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: 0.08em;
      transition: color 0.5s;
    }

    .form-group { margin-bottom: 17px; }

    .form-label {
      display: block;
      font-size: 0.76rem;
      color: #4e6278;
      margin-bottom: 7px;
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    /* Style Django-rendered inputs uniformly */
    .login-card input[type="text"],
    .login-card input[type="password"],
    .login-card input[type="email"],
    .login-card input:not([type="submit"]):not([type="hidden"]):not([type="checkbox"]) {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;
      color: #dce8f5;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .login-card input:focus {
      border-color: hsl(var(--shade-hue), 80%, 50%);
      box-shadow: 0 0 0 3px hsl(var(--shade-hue), 80%, 25%);
    }

    .field-error {
      color: #ff7070;
      font-size: 0.74rem;
      margin-top: 5px;
    }

    .form-row-bottom {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .forgot-link {
      font-size: 0.74rem;
      color: hsl(var(--shade-hue), 55%, 50%);
      text-decoration: none;
      transition: color 0.3s;
    }
    .forgot-link:hover { color: hsl(var(--shade-hue), 75%, 65%); text-decoration: underline; }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 12px;
      background: hsl(var(--shade-hue), 65%, 40%);
      border: none;
      border-radius: 9px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 12px;
      letter-spacing: 0.1em;
      transition: background 0.35s, box-shadow 0.35s, transform 0.12s;
    }
    .btn-submit:hover {
      background: hsl(var(--shade-hue), 80%, 52%);
      box-shadow: 0 4px 24px hsl(var(--shade-hue), 80%, 26%);
    }
    .btn-submit:active { transform: scale(0.97); }

    .auth-links {
      text-align: center;
      margin-top: 18px;
      font-size: 0.78rem;
      color: #2e4050;
    }
    .auth-links a {
      color: hsl(var(--shade-hue), 60%, 56%);
      text-decoration: none;
      transition: color 0.3s;
    }
    .auth-links a:hover { color: hsl(var(--shade-hue), 80%, 68%); text-decoration: underline; }

    /* ────────────────────────── FOOTER ────────────────────────── */
    .page-footer {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      color: #1e2e3e;
      letter-spacing: 0.05em;
      z-index: 1;
      pointer-events: none;
    }

    /* ────────────────────────── RESPONSIVE ────────────────────────── */
    @media (max-width: 680px) {
      .scene { flex-direction: column; gap: 24px; padding-top: 24px; }
      .login-card { width: 100%; max-width: 340px; }
    }
  </style>
</head>
<body>

<div class="scene">

  <!-- ══════════════════ LAMP ══════════════════ -->
  <div class="lamp-wrap" id="lampWrap">

    <svg id="lamp-svg" width="200" height="260" viewBox="0 0 200 260"
         xmlns="http://www.w3.org/2000/svg">

      <!-- Light cone (visible when on) -->
      <path id="light-cone"
        d="M72 134 L28 240 L172 240 L128 134 Z"
        fill="hsl(45,90%,62%)" opacity="0"/>

      <!-- Base -->
      <ellipse cx="100" cy="252" rx="44" ry="8" fill="#16223a"/>
      <!-- Stem -->
      <rect x="93" y="200" width="14" height="54" rx="5" fill="#1a2a40"/>
      <!-- Lower arm -->
      <path d="M100 204 Q118 172 132 148"
            stroke="#1a2a40" stroke-width="9" stroke-linecap="round" fill="none"/>
      <!-- Elbow joint -->
      <circle cx="132" cy="148" r="6" fill="#1a2a40"/>
      <!-- Upper arm -->
      <path d="M132 148 Q130 130 100 118"
            stroke="#1a2a40" stroke-width="8" stroke-linecap="round" fill="none"/>

      <!-- Shade outer -->
      <path d="M84 112 L72 140 L128 140 L116 112 Z"
            fill="#1d2e45" stroke="#13202f" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Shade rim -->
      <ellipse cx="100" cy="140" rx="28" ry="5" fill="#13202f"/>
      <!-- Shade highlight stripe -->
      <path d="M88 116 Q100 109 112 116" stroke="rgba(255,255,255,0.055)" stroke-width="1.5" fill="none"/>
      <!-- Shade top cap -->
      <ellipse cx="100" cy="112" rx="16" ry="4" fill="#16253a"/>

      <!-- Bulb glow -->
      <ellipse id="bulb"
        cx="100" cy="134" rx="20" ry="9"
        fill="hsl(45,90%,68%)" opacity="0"/>

      <!-- Eyes group — rotate(180,100,122) = looking down; rotate(0,100,122) = looking up -->
      <g id="eyes-group">
        <!-- Left eye -->
        <circle cx="90" cy="124" r="5" fill="#0d1928"/>
        <circle cx="90" cy="124" r="3.8" fill="#192840"/>
        <circle cx="90" cy="124" r="2.1" fill="#07101c"/>
        <circle cx="91.4" cy="122.6" r="1.1" fill="rgba(255,255,255,0.42)"/>
        <!-- Right eye -->
        <circle cx="110" cy="124" r="5" fill="#0d1928"/>
        <circle cx="110" cy="124" r="3.8" fill="#192840"/>
        <circle cx="110" cy="124" r="2.1" fill="#07101c"/>
        <circle cx="111.4" cy="122.6" r="1.1" fill="rgba(255,255,255,0.42)"/>
      </g>

    </svg>

    <!-- Rope zone — top matches shade rim y in CSS px -->
    <div class="rope-zone" id="ropeZone">
      <svg id="rope-svg" width="40" height="80" viewBox="0 0 40 80">
        <!-- Rope path: from top (20,0) to knob (20,68) -->
        <path id="rope-path"
          d="M20,0 C20,22 20,44 20,65"
          stroke="#2a3e56" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      </svg>
      <!-- Draggable knob sits at rope end -->
      <div class="rope-knob" id="ropeKnob">
        <div class="rope-knob-dot"></div>
      </div>
    </div>

    <p class="lamp-hint" id="lampHint">↕ 拖动拉绳开灯</p>
  </div>

  <!-- ══════════════════ LOGIN CARD ══════════════════ -->
  <div class="login-card" id="loginCard">
    <h2>欢迎回来</h2>
    <form method="post" autocomplete="on">
      {% csrf_token %}
      {% if form %}
        {% for field in form %}
        <div class="form-group">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
          <p class="field-error">{{ error }}</p>
          {% endfor %}
        </div>
        {% endfor %}
        <div class="form-row-bottom">
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>
      {% else %}
        <div class="form-group">
          <label class="form-label">账号</label>
          <input type="text" name="username" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" name="password" placeholder="请输入密码" autocomplete="current-password">
          <div class="form-row-bottom" style="margin-top:7px;">
            <a href="#" class="forgot-link">忘记密码？</a>
          </div>
        </div>
      {% endif %}
      <button type="submit" class="btn-submit">登 录</button>
    </form>
    <div class="auth-links">还没有账号？<a href="{% url 'register' %}">立即注册</a></div>
  </div>

</div>

<footer class="page-footer" id="pageFooter"></footer>

<!-- GSAP core + Draggable (free CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>

<script>
gsap.registerPlugin(Draggable);

// ── State ─────────────────────────────────────────────────────────
let lampOn = false;
let dragTriggered = false;

// ── Footer date ───────────────────────────────────────────────────
{
  const d = new Date();
  document.getElementById('pageFooter').textContent =
    d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' })
    + '  ·  ACM OJ 算法竞赛平台';
}

// ── Web Audio "咔哒" click ────────────────────────────────────────
function playClick() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const sr = ac.sampleRate;
    const len = sr * 0.10;
    const buf = ac.createBuffer(1, len, sr);
    const ch  = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      // sharp noise burst with fast exponential decay
      ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.010));
    }
    const g = ac.createGain();
    g.gain.value = 0.55;
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.connect(g).connect(ac.destination);
    src.start();
    // tiny second click (mechanical feel)
    gsap.delayedCall(0.06, () => {
      const buf2 = ac.createBuffer(1, sr * 0.05, sr);
      const ch2  = buf2.getChannelData(0);
      for (let i = 0; i < ch2.length; i++) {
        ch2[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.007));
      }
      const g2 = ac.createGain();
      g2.gain.value = 0.3;
      const src2 = ac.createBufferSource();
      src2.buffer = buf2;
      src2.connect(g2).connect(ac.destination);
      src2.start();
    });
  } catch (_) {}
}

// ── Apply hue ─────────────────────────────────────────────────────
function applyHue(hue) {
  document.documentElement.style.setProperty('--shade-hue', hue);
  document.getElementById('bulb').setAttribute('fill', `hsl(${hue},92%,68%)`);
  document.getElementById('light-cone').setAttribute('fill', `hsl(${hue},88%,62%)`);
}

// ── Toggle lamp ───────────────────────────────────────────────────
function toggleLamp() {
  lampOn = !lampOn;
  playClick();

  const root  = document.documentElement;
  const wrap  = document.getElementById('lampWrap');
  const card  = document.getElementById('loginCard');
  const hint  = document.getElementById('lampHint');
  const eyes  = document.getElementById('eyes-group');

  if (lampOn) {
    const hue = Math.floor(Math.random() * 360);
    applyHue(hue);
    root.style.setProperty('--on', '1');
    wrap.classList.add('lamp-lit');

    // Eyes rotate to 0 = looking up (awake)
    gsap.to(eyes, {
      rotation: 0,
      transformOrigin: '100px 124px',
      duration: 0.45,
      ease: 'back.out(2)'
    });
    // Glow on
    gsap.to('#bulb',       { opacity: 0.9, duration: 0.35 });
    gsap.to('#light-cone', { opacity: 0.09, duration: 0.5 });
    // Show form (spring)
    card.classList.add('show');
    hint.textContent = '↕ 拖动拉绳关灯';
  } else {
    root.style.setProperty('--on', '0');
    wrap.classList.remove('lamp-lit');

    // Eyes rotate 180 = looking down (asleep)
    gsap.to(eyes, {
      rotation: 180,
      transformOrigin: '100px 124px',
      duration: 0.45,
      ease: 'back.out(2)'
    });
    // Glow off
    gsap.to('#bulb',       { opacity: 0, duration: 0.3 });
    gsap.to('#light-cone', { opacity: 0, duration: 0.3 });
    // Hide form
    card.classList.remove('show');
    hint.textContent = '↕ 拖动拉绳开灯';
  }
}

// ── Rope path helper ──────────────────────────────────────────────
// ropeEndY: how far the rope end has moved below rest (in SVG units = px here)
function setRopePath(ropeEndDy) {
  const restEnd = 65;
  const endY  = restEnd + ropeEndDy;
  const c1Y   = 22  + ropeEndDy * 0.28;
  const c2Y   = 44  + ropeEndDy * 0.62;
  document.getElementById('rope-path').setAttribute(
    'd', `M20,0 C20,${c1Y} 20,${c2Y} 20,${endY}`
  );
}

// ── Rope spring bounce ────────────────────────────────────────────
function bounceRope(maxDy) {
  // damped oscillation: each half-cycle halves the amplitude
  const amps = [1, -0.52, 0.27, -0.13, 0.06, -0.02, 0];
  const step = 0.095;
  amps.forEach((a, i) => {
    gsap.delayedCall(i * step, () => setRopePath(maxDy * a));
  });
}

// ── Draggable knob ────────────────────────────────────────────────
Draggable.create('#ropeKnob', {
  type: 'y',
  bounds: { minY: 0, maxY: 130 },
  onDragStart() {
    dragTriggered = false;
  },
  onDrag() {
    const dy = Math.max(0, this.y);
    setRopePath(dy * 0.55);           // rope stretches at 55% of knob travel
    if (dy > 50 && !dragTriggered) {
      dragTriggered = true;
      toggleLamp();
    }
  },
  onDragEnd() {
    const maxDy = Math.max(0, this.y) * 0.55;
    // Snap knob back with elastic
    gsap.to(this.target, {
      y: 0,
      duration: 0.7,
      ease: 'elastic.out(1, 0.42)'
    });
    // Animate rope bounce
    bounceRope(maxDy);
  }
});

// ── Init ──────────────────────────────────────────────────────────
// Eyes start rotated 180° (looking down — lamp off)
gsap.set('#eyes-group', { rotation: 180, transformOrigin: '100px 124px' });

{% if form.errors %}
// Auto-open lamp if Django returned form errors (so user sees the form)
window.addEventListener('load', () => {
  gsap.delayedCall(0.6, toggleLamp);
});
{% endif %}
</script>
</body>
</html>
