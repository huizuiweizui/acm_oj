{% extends 'judge/base.html' %}
{% block title %}发布讨论{% endblock %}
{% block content %}
<div class="container" style="padding-top:32px;max-width:720px;">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">发布讨论 — #{{ problem.id }} {{ problem.title }}</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">标题</label>
                    {{ form.title }}
                </div>
                <div class="form-group">
                    <label class="form-label">内容（支持 Markdown）</label>
                    {{ form.content }}
                </div>
                <div style="display:flex;gap:12px;">
                    <button type="submit" class="btn btn-primary">发布</button>
                    <a href="{% url 'problem_detail' problem.id %}" class="btn btn-ghost">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
